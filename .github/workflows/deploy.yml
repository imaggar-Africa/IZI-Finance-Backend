name: Deploy IZI Backend

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t dockerimaggar/izi-backend .

      - name: Push Docker image
        run: |
          docker push dockerimaggar/izi-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull dockerimaggar/izi-backend:latest
            docker rm -f izi-backend
            docker run -d \
              -p 8080:8080 \
              --name izi-backend \
              --env-file .env \
              --restart always \
              dockerimaggar/izi-backend:latest