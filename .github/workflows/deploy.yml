name: Build and Push Docker

# Manual only — avoids red X on staging when Docker Hub secrets are not set.
# Vercel deploys separately from vercel.json.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -f docker/Dockerfile -t dockerimaggar/izi-backend:latest .

      - name: Push image
        run: docker push dockerimaggar/izi-backend:latest
